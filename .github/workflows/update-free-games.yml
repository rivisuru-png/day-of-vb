name: Update Free Games

on:
  schedule:
    - cron: '0 12 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch current free games and update free-games.json
        run: node scripts/fetch-free-games.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add free-games.json
          git diff --staged --quiet || git commit -m "Auto-update free games list"
          git push
